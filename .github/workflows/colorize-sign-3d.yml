name: Colorize Sign 3D IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ColorizeSign3D/**"
      - ".github/workflows/colorize-sign-3d.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ColorizeSign3D
        run: xcodegen generate

      - name: Build for iPhone
        working-directory: ColorizeSign3D
        run: |
          set -o pipefail
          xcodebuild \
            -project ColorizeSign3D.xcodeproj \
            -scheme ColorizeSign3D \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package unsigned IPA
        working-directory: ColorizeSign3D
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ColorizeSign3D.app Payload/
          /usr/bin/zip -qry ColorizeSign3D-v1.0-unsigned.ipa Payload
          test -s ColorizeSign3D-v1.0-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ColorizeSign3D-v1.0-IPA
          path: ColorizeSign3D/ColorizeSign3D-v1.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ColorizeSign3D-build-log
          path: ColorizeSign3D/xcodebuild.log
          if-no-files-found: ignore
