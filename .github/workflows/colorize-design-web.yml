name: Colorize Design Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ColorizeDesignWeb/**"
      - ".github/workflows/colorize-design-web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: colorize-design-web-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate web app
        run: |
          test -s ColorizeDesignWeb/index.html
          test -s ColorizeDesignWeb/styles.css
          test -s ColorizeDesignWeb/boot-v0133.js
          test -s ColorizeDesignWeb/v0133-lighting-owner.js
          test -s ColorizeDesignWeb/tests/lighting-order.test.mjs
          test -s ColorizeDesignWeb/tests/lighting-browser-smoke.py
          node --input-type=module --check < ColorizeDesignWeb/app.js
          node --input-type=module --check < ColorizeDesignWeb/v011-realtime-3d.js
          node --input-type=module --check < ColorizeDesignWeb/v012-3d-pro.js
          node --input-type=module --check < ColorizeDesignWeb/v012-construction.js
          node --input-type=module --check < ColorizeDesignWeb/v012-facade-bridge.js
          node --input-type=module --check < ColorizeDesignWeb/v013-lighting.js
          node --input-type=module --check < ColorizeDesignWeb/v0133-lighting-owner.js
          node --input-type=module --check < ColorizeDesignWeb/facade.js

      - name: Test lighting hook order
        run: node ColorizeDesignWeb/tests/lighting-order.test.mjs

      - name: Test lighting in a real browser
        run: |
          python -m pip install --quiet websocket-client
          python ColorizeDesignWeb/tests/lighting-browser-smoke.py

      - name: Package browser build
        run: |
          cd ColorizeDesignWeb
          zip -qr ../ColorizeDesignWeb-v0.13.3.zip .

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: ColorizeDesignWeb-v0.13.3
          path: ColorizeDesignWeb-v0.13.3.zip
          retention-days: 30

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ColorizeDesignWeb

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
