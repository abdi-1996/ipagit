name: Colorize Design Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ColorizeDesignWeb/**"
      - ".github/workflows/colorize-design-web.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate web app
        run: |
          test -s ColorizeDesignWeb/index.html
          test -s ColorizeDesignWeb/styles.css
          test -s ColorizeDesignWeb/app.js
      - name: Package browser build
        run: |
          cd ColorizeDesignWeb
          zip -qr ../ColorizeDesignWeb-v0.1.zip .
      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: ColorizeDesignWeb-v0.1
          path: ColorizeDesignWeb-v0.1.zip
          retention-days: 30
