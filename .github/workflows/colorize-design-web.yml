name: Colorize Design Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ColorizeDesignWeb/**"
      - ".github/workflows/colorize-design-web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: colorize-design-web-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate web app
        run: |
          test -s ColorizeDesignWeb/index.html
          test -s ColorizeDesignWeb/styles.css
          test -s ColorizeDesignWeb/app.js
          node --check ColorizeDesignWeb/app.js

      - name: Package browser build
        run: |
          cd ColorizeDesignWeb
          zip -qr ../ColorizeDesignWeb-v0.2.zip .

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: ColorizeDesignWeb-v0.2
          path: ColorizeDesignWeb-v0.2.zip
          retention-days: 30

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ColorizeDesignWeb

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
