name: Colorize Design Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ColorizeDesignWeb/**"
      - ".github/workflows/colorize-design-web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: colorize-design-web-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate web app
        run: |
          test -s ColorizeDesignWeb/index.html
          test -s ColorizeDesignWeb/styles.css
          test -s ColorizeDesignWeb/three-colorize.js
          test -s ColorizeDesignWeb/boot-v017.js
          test -s ColorizeDesignWeb/boot-v018.js
          test -s ColorizeDesignWeb/boot-v019.js
          test -s ColorizeDesignWeb/boot-v020.js
          test -s ColorizeDesignWeb/boot-v021.js
          test -s ColorizeDesignWeb/boot-v022.js
          test -s ColorizeDesignWeb/boot-v023.js
          test -s ColorizeDesignWeb/v0135-lighting-engine.js
          test -s ColorizeDesignWeb/v0135-lighting-ui-bridge.js
          test -s ColorizeDesignWeb/v014-assembled-signs.js
          test -s ColorizeDesignWeb/v015-true-assembly.js
          test -s ColorizeDesignWeb/v016-affinity-workspace.js
          test -s ColorizeDesignWeb/v017-infinite-workspace.js
          test -s ColorizeDesignWeb/v018-geometry-quality.js
          test -s ColorizeDesignWeb/v019-separate-parts.js
          test -s ColorizeDesignWeb/v019-parts-ui.js
          test -s ColorizeDesignWeb/v020-acrylic-materials.js
          test -s ColorizeDesignWeb/v021-clean-3d-scene.js
          test -s ColorizeDesignWeb/v022-history-gestures.js
          test -s ColorizeDesignWeb/v023-face-contour-fit.js
          test -s ColorizeDesignWeb/tests/history-undo-redo-browser-smoke.py
          test -s ColorizeDesignWeb/tests/lighting-browser-smoke.py
          test -s ColorizeDesignWeb/tests/assembled-sign-browser-smoke.py
          test -s ColorizeDesignWeb/tests/true-assembly-browser-smoke.py
          test -s ColorizeDesignWeb/tests/separate-parts-browser-smoke.py
          test -s ColorizeDesignWeb/tests/cap-normal-browser-smoke.py
          test -s ColorizeDesignWeb/tests/acrylic-materials-browser-smoke.py
          test -s ColorizeDesignWeb/tests/clean-3d-scene-browser-smoke.py
          test -s ColorizeDesignWeb/tests/face-contour-fit-browser-smoke.py
          test -s ColorizeDesignWeb/tests/affinity-workspace-browser-smoke.py
          test -s ColorizeDesignWeb/tests/infinite-workspace-browser-smoke.py
          node --input-type=module --check < ColorizeDesignWeb/three-colorize.js
          node --input-type=module --check < ColorizeDesignWeb/app.js
          node --input-type=module --check < ColorizeDesignWeb/v011-realtime-3d.js
          node --input-type=module --check < ColorizeDesignWeb/v012-3d-pro.js
          node --input-type=module --check < ColorizeDesignWeb/v012-construction.js
          node --input-type=module --check < ColorizeDesignWeb/v012-facade-bridge.js
          node --input-type=module --check < ColorizeDesignWeb/v013-lighting.js
          node --input-type=module --check < ColorizeDesignWeb/v0135-lighting-engine.js
          node --input-type=module --check < ColorizeDesignWeb/v0135-lighting-ui-bridge.js
          node --input-type=module --check < ColorizeDesignWeb/v014-assembled-signs.js
          node --input-type=module --check < ColorizeDesignWeb/v014-overlay-guard.js
          node --input-type=module --check < ColorizeDesignWeb/v015-true-assembly.js
          node --input-type=module --check < ColorizeDesignWeb/v016-affinity-workspace.js
          node --input-type=module --check < ColorizeDesignWeb/v017-infinite-workspace.js
          node --input-type=module --check < ColorizeDesignWeb/v018-geometry-quality.js
          node --input-type=module --check < ColorizeDesignWeb/v019-separate-parts.js
          node --input-type=module --check < ColorizeDesignWeb/v019-parts-ui.js
          node --input-type=module --check < ColorizeDesignWeb/v020-acrylic-materials.js
          node --input-type=module --check < ColorizeDesignWeb/v021-clean-3d-scene.js
          node --input-type=module --check < ColorizeDesignWeb/v022-history-gestures.js
          node --input-type=module --check < ColorizeDesignWeb/v023-face-contour-fit.js
          node --input-type=module --check < ColorizeDesignWeb/boot-v018.js
          node --input-type=module --check < ColorizeDesignWeb/boot-v019.js
          node --input-type=module --check < ColorizeDesignWeb/boot-v020.js
          node --input-type=module --check < ColorizeDesignWeb/boot-v021.js
          node --input-type=module --check < ColorizeDesignWeb/boot-v022.js
          node --input-type=module --check < ColorizeDesignWeb/boot-v023.js
          node --input-type=module --check < ColorizeDesignWeb/facade.js
          python -m py_compile ColorizeDesignWeb/tests/history-undo-redo-browser-smoke.py
          python -m py_compile ColorizeDesignWeb/tests/separate-parts-browser-smoke.py
          python -m py_compile ColorizeDesignWeb/tests/cap-normal-browser-smoke.py
          python -m py_compile ColorizeDesignWeb/tests/acrylic-materials-browser-smoke.py
          python -m py_compile ColorizeDesignWeb/tests/clean-3d-scene-browser-smoke.py
          python -m py_compile ColorizeDesignWeb/tests/face-contour-fit-browser-smoke.py

      - name: Install browser test dependency
        run: python -m pip install --quiet websocket-client

      - name: Test Undo Redo keyboard and touch gestures
        run: python ColorizeDesignWeb/tests/history-undo-redo-browser-smoke.py

      - name: Test lighting in a real browser
        run: python ColorizeDesignWeb/tests/lighting-browser-smoke.py

      - name: Test assembled materials in a real browser
        run: python ColorizeDesignWeb/tests/assembled-sign-browser-smoke.py

      - name: Test separated letter geometry in a real browser
        run: python ColorizeDesignWeb/tests/true-assembly-browser-smoke.py

      - name: Test independent face, returns and back meshes
        run: python ColorizeDesignWeb/tests/separate-parts-browser-smoke.py

      - name: Test exact face / returns / back XY contour
        run: python ColorizeDesignWeb/tests/face-contour-fit-browser-smoke.py

      - name: Test planar front-cap normals
        run: python ColorizeDesignWeb/tests/cap-normal-browser-smoke.py

      - name: Test acrylic material library
        run: python ColorizeDesignWeb/tests/acrylic-materials-browser-smoke.py || python ColorizeDesignWeb/tests/acrylic-materials-browser-smoke.py

      - name: Test clean 3D scene and facade gating
        run: python ColorizeDesignWeb/tests/clean-3d-scene-browser-smoke.py || python ColorizeDesignWeb/tests/clean-3d-scene-browser-smoke.py

      - name: Test Affinity-inspired 2D workspace in a real browser
        run: python ColorizeDesignWeb/tests/affinity-workspace-browser-smoke.py

      - name: Test infinite white centimetre workspace in a real browser
        run: python ColorizeDesignWeb/tests/infinite-workspace-browser-smoke.py

      - name: Package browser build
        run: |
          cd ColorizeDesignWeb
          zip -qr ../ColorizeDesignWeb-v0.23.0.zip .

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: ColorizeDesignWeb-v0.23.0
          path: ColorizeDesignWeb-v0.23.0.zip
          retention-days: 30

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ColorizeDesignWeb

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
