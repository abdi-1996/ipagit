name: Colorize Design Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ColorizeDesignWeb/**"
      - ".github/workflows/colorize-design-web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: colorize-design-web-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate v0.32 web app
        run: |
          test -s ColorizeDesignWeb/index.html
          test -s ColorizeDesignWeb/styles.css
          test -s ColorizeDesignWeb/three-colorize.js
          test -s ColorizeDesignWeb/app.js
          test -s ColorizeDesignWeb/boot-v032.js
          test -s ColorizeDesignWeb/v032-function-fixes.js
          test -s ColorizeDesignWeb/v031-text-editor.js
          test -s ColorizeDesignWeb/v031-tool-stability.js
          test -s ColorizeDesignWeb/v030-affinity-2d.js
          test -s ColorizeDesignWeb/v030.css
          test -s ColorizeDesignWeb/tests/full-function-v032-browser.py
          node --input-type=module --check < ColorizeDesignWeb/v032-function-fixes.js
          node --input-type=module --check < ColorizeDesignWeb/boot-v032.js
          node --input-type=module --check < ColorizeDesignWeb/v031-text-editor.js
          node --input-type=module --check < ColorizeDesignWeb/v031-tool-stability.js
          node --input-type=module --check < ColorizeDesignWeb/v030-affinity-2d.js
          python -m py_compile ColorizeDesignWeb/tests/full-function-v032-browser.py
          python -m py_compile ColorizeDesignWeb/tests/editor-stability-v031-browser-smoke.py
          python -m py_compile ColorizeDesignWeb/tests/history-undo-redo-browser-smoke.py
          python -m py_compile ColorizeDesignWeb/tests/acrylic-pbr-v028-browser-smoke.py
          python -m py_compile ColorizeDesignWeb/tests/unified-hdri-browser-smoke.py
          python -m py_compile ColorizeDesignWeb/tests/lighting-browser-smoke.py
          python -m py_compile ColorizeDesignWeb/tests/true-assembly-browser-smoke.py
          python -m py_compile ColorizeDesignWeb/tests/face-contour-fit-browser-smoke.py
          python -m py_compile ColorizeDesignWeb/tests/clean-3d-scene-browser-smoke.py

      - name: Install browser test dependency
        run: python -m pip install --quiet websocket-client

      - name: Startup and stable viewport text editing
        run: timeout 45s python ColorizeDesignWeb/tests/editor-stability-v031-browser-smoke.py

      - name: Full audit — all 24 2D tools and core commands
        run: timeout 150s python -u ColorizeDesignWeb/tests/full-function-v032-browser.py

      - name: Undo and Redo regression
        run: python ColorizeDesignWeb/tests/history-undo-redo-browser-smoke.py || python ColorizeDesignWeb/tests/history-undo-redo-browser-smoke.py

      - name: Acrylic PBR regression
        run: python ColorizeDesignWeb/tests/acrylic-pbr-v028-browser-smoke.py || python ColorizeDesignWeb/tests/acrylic-pbr-v028-browser-smoke.py

      - name: Unified HDRI regression
        run: python ColorizeDesignWeb/tests/unified-hdri-browser-smoke.py || python ColorizeDesignWeb/tests/unified-hdri-browser-smoke.py

      - name: Lighting regression
        run: python ColorizeDesignWeb/tests/lighting-browser-smoke.py || python ColorizeDesignWeb/tests/lighting-browser-smoke.py

      - name: True 3D assembly regression
        run: python ColorizeDesignWeb/tests/true-assembly-browser-smoke.py || python ColorizeDesignWeb/tests/true-assembly-browser-smoke.py

      - name: Exact face contour regression
        run: python ColorizeDesignWeb/tests/face-contour-fit-browser-smoke.py || python ColorizeDesignWeb/tests/face-contour-fit-browser-smoke.py

      - name: Clean 3D scene regression
        run: python ColorizeDesignWeb/tests/clean-3d-scene-browser-smoke.py || python ColorizeDesignWeb/tests/clean-3d-scene-browser-smoke.py

      - name: Package browser build
        run: |
          cd ColorizeDesignWeb
          zip -qr ../ColorizeDesignWeb-v0.32.0.zip .

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: ColorizeDesignWeb-v0.32.0
          path: ColorizeDesignWeb-v0.32.0.zip
          retention-days: 30

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ColorizeDesignWeb

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
