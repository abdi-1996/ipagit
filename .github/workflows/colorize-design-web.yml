name: Colorize Design Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ColorizeDesignWeb/**"
      - ".github/workflows/colorize-design-web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: colorize-design-web-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate v0.27.1 web app
        run: |
          test -s ColorizeDesignWeb/index.html
          test -s ColorizeDesignWeb/styles.css
          test -s ColorizeDesignWeb/three-colorize.js
          test -s ColorizeDesignWeb/app.js
          test -s ColorizeDesignWeb/boot-v027.js
          test -s ColorizeDesignWeb/v027-unified-hdri.js
          test -s ColorizeDesignWeb/v0271-hdri-passive-mode.js
          test -s ColorizeDesignWeb/v0251-hdri-fixed.js
          test -s ColorizeDesignWeb/assets/hdri/jeksterer23-64-fixed.b64
          test -s ColorizeDesignWeb/tests/unified-hdri-browser-smoke.py
          node --input-type=module --check < ColorizeDesignWeb/app.js
          node --input-type=module --check < ColorizeDesignWeb/v027-unified-hdri.js
          node --input-type=module --check < ColorizeDesignWeb/v0271-hdri-passive-mode.js
          node --input-type=module --check < ColorizeDesignWeb/boot-v027.js
          python -m py_compile ColorizeDesignWeb/tests/unified-hdri-browser-smoke.py

      - name: Install browser test dependency
        run: python -m pip install --quiet websocket-client

      - name: Test unified HDRI source and visible size
        run: python ColorizeDesignWeb/tests/unified-hdri-browser-smoke.py || python ColorizeDesignWeb/tests/unified-hdri-browser-smoke.py

      - name: Legacy regression smoke tests
        continue-on-error: true
        run: |
          python ColorizeDesignWeb/tests/history-undo-redo-browser-smoke.py || true
          python ColorizeDesignWeb/tests/lighting-browser-smoke.py || true
          python ColorizeDesignWeb/tests/jeksterer-hdri-fixed-browser-smoke.py || true
          python ColorizeDesignWeb/tests/face-contour-fit-browser-smoke.py || true
          python ColorizeDesignWeb/tests/acrylic-materials-browser-smoke.py || true
          python ColorizeDesignWeb/tests/clean-3d-scene-browser-smoke.py || true

      - name: Package browser build
        run: |
          cd ColorizeDesignWeb
          zip -qr ../ColorizeDesignWeb-v0.27.1.zip .

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: ColorizeDesignWeb-v0.27.1
          path: ColorizeDesignWeb-v0.27.1.zip
          retention-days: 30

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ColorizeDesignWeb

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
