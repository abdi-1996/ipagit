<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#17191d" />
  <title>Colorize Designer Web</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./v05.css" />
  <link rel="stylesheet" href="./v06.css" />
  <link rel="stylesheet" href="./v07.css" />
  <link rel="stylesheet" href="./v08.css" />
  <link rel="stylesheet" href="./v081.css" />
  <link rel="stylesheet" href="./facade.css" />
  <link rel="stylesheet" href="./v010.css" />
  <link rel="stylesheet" href="./v011.css" />
  <link rel="stylesheet" href="./v012.css" />
  <link rel="stylesheet" href="./v013.css" />
  <link rel="stylesheet" href="./v014.css?v=0280" />
  <link rel="stylesheet" href="./v016.css?v=0280" />
  <link rel="stylesheet" href="./v017.css?v=0280" />
  <script type="importmap">
  {
    "imports": {
      "./app.js": "./app.js?v=0280",
      "./v015-true-assembly.js": "./v015-true-assembly.js?v=0280",
      "./v012-construction.js": "./v012-construction.js?v=0280",
      "./v017-infinite-workspace.js": "./v017-infinite-workspace.js?v=0280",
      "three": "./three-colorize.js?v=0280",
      "three-core": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><strong>COLORIZE<br>DESIGN</strong><span>Web v0.28.0</span></div>
    <div class="mode-group" aria-label="Режим отображения">
      <button class="mode active" data-mode="2d">2D</button>
      <button class="mode" data-mode="view3d">3D</button>
      <button id="lightingBtn" class="lighting-btn">Свет</button>
      <button id="view3dRenderBtn" class="view3d-render" hidden aria-hidden="true">Render OFF</button>
    </div>
    <div class="top-actions">
      <button id="fitBtn">Вписать</button>
      <button id="reset3dBtn" hidden>2D кадр</button>
      <button id="saveBtn">Сохранить</button>
      <button id="panelToggle" class="mobile-only">Панели</button>
    </div>
  </header>

  <div class="main-grid">
    <aside class="leftbar">
      <button id="selectTool" class="tool active">↖</button>
      <button id="panTool" class="tool">✋</button>
      <button id="addArtboardBtn" class="tool">▣</button>
      <button id="addTextBtn" class="tool">T</button>
      <button id="addRectBtn" class="tool">▭</button>
      <label class="tool file-tool">⌁<input id="imageInput" type="file" accept="image/*" hidden /></label>
      <div class="tool-sep"></div>
      <button id="zoomOutBtn" class="tool">−</button>
      <button id="zoomInBtn" class="tool">+</button>
      <button id="centerBtn" class="tool">◎</button>
    </aside>

    <main id="viewport" class="viewport" tabindex="0">
      <div class="viewport-grid"></div>
      <div id="world" class="world"></div>
      <div id="threeHost" class="three-host" hidden>
        <div id="threeLoading" class="three-loading">Строим реалистичную 3D-модель…</div>
      </div>
      <div class="mode-badge" id="modeBadge">Бесконечная область · см</div>
      <div class="statusbar">
        <span id="toolStatus">Выбор</span><span id="zoomStatus">100%</span><span id="coordStatus">X 0 см · Y 0 см</span>
      </div>
    </main>

    <aside id="rightPanel" class="right-panel">
      <button id="mobileSheetHandle" class="mobile-sheet-handle" aria-label="Закрыть"><span></span></button>
      <div class="panel-tabs">
        <button class="panel-tab active" data-panel="layers">Слои</button>
        <button class="panel-tab" data-panel="artboards">Artboards</button>
        <button class="panel-tab" data-panel="properties">Вывеска</button>
      </div>
      <section id="panel-layers" class="panel-body active">
        <div class="panel-head"><strong>Слои</strong><button id="duplicateBtn">Дубль</button></div>
        <div id="layersList" class="list"></div>
      </section>
      <section id="panel-artboards" class="panel-body">
        <div class="panel-head"><strong>Монтажные области</strong><button id="panelAddArtboardBtn">+</button></div>
        <div id="artboardsList" class="list"></div>
      </section>
      <section id="panel-properties" class="panel-body">
        <div class="panel-head"><strong>Свойства вывески</strong></div>
        <div id="properties" class="properties empty">Выберите объект</div>
      </section>
      <div class="panel-footer">
        <button id="newProjectBtn">Новый</button>
        <button id="exportBtn">Экспорт JSON</button>
        <label class="import-label">Импорт JSON<input id="importInput" type="file" accept="application/json,.json" hidden /></label>
      </div>
    </aside>
  </div>

  <nav class="mobile-bottom-dock" aria-label="Инструменты">
    <button id="dockSelect"><span class="dock-icon">↖</span><span>Выбор</span></button>
    <button id="dockText"><span class="dock-icon">T</span><span>Текст</span></button>
    <button id="dockPhoto"><span class="dock-icon">▧</span><span>Фото</span></button>
    <button id="dockLayers"><span class="dock-icon">▤</span><span>Слои</span></button>
    <button id="dockSign"><span class="dock-icon">◆</span><span>Вывеска</span></button>
  </nav>
</div>
<script type="module" src="./boot-v028.js?v=0280"></script>
</body>
</html>
