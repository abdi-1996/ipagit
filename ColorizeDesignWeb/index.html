<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#17191d" />
  <title>Colorize Design Web</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <strong>COLORIZE<br>DESIGN</strong>
        <span>Web v0.2</span>
      </div>
      <div class="mode-group" aria-label="Режим отображения">
        <button class="mode active" data-mode="2d">2D</button>
        <button class="mode" data-mode="3d">3D</button>
        <button class="mode" data-mode="render">Render</button>
        <button class="mode" data-mode="view3d">3D View</button>
        <button id="view3dRenderBtn" class="view3d-render" hidden>Render OFF</button>
      </div>
      <div class="top-actions">
        <button id="fitBtn" title="Показать Artboard целиком">Вписать</button>
        <button id="saveBtn">Сохранить</button>
        <button id="panelToggle" class="mobile-only">Панели</button>
      </div>
    </header>

    <div class="main-grid">
      <aside class="leftbar">
        <button id="selectTool" class="tool active" title="Выбор">↖</button>
        <button id="panTool" class="tool" title="Рука / панорама">✋</button>
        <button id="addArtboardBtn" class="tool" title="Artboard">▣</button>
        <button id="addTextBtn" class="tool" title="Текст">T</button>
        <button id="addRectBtn" class="tool" title="Прямоугольник">▭</button>
        <label class="tool file-tool" title="Импорт изображения">⌁
          <input id="imageInput" type="file" accept="image/*" hidden />
        </label>
        <div class="tool-sep"></div>
        <button id="zoomOutBtn" class="tool" title="Уменьшить">−</button>
        <button id="zoomInBtn" class="tool" title="Увеличить">+</button>
        <button id="centerBtn" class="tool" title="Центрировать рабочую область">◎</button>
      </aside>

      <main id="viewport" class="viewport" tabindex="0">
        <div class="viewport-grid"></div>
        <div id="world" class="world"></div>
        <div class="mode-badge" id="modeBadge">2D · редактирование</div>
        <div class="statusbar">
          <span id="toolStatus">Выбор</span>
          <span id="zoomStatus">100%</span>
          <span id="coordStatus">X 0 · Y 0</span>
        </div>
      </main>

      <aside id="rightPanel" class="right-panel">
        <div class="panel-tabs">
          <button class="panel-tab active" data-panel="layers">Слои</button>
          <button class="panel-tab" data-panel="artboards">Artboards</button>
          <button class="panel-tab" data-panel="properties">Вывеска</button>
        </div>

        <section id="panel-layers" class="panel-body active">
          <div class="panel-head">
            <strong>Слои</strong>
            <button id="duplicateBtn">Дубль</button>
          </div>
          <div id="layersList" class="list"></div>
        </section>

        <section id="panel-artboards" class="panel-body">
          <div class="panel-head">
            <strong>Монтажные области</strong>
            <button id="panelAddArtboardBtn">+</button>
          </div>
          <div id="artboardsList" class="list"></div>
        </section>

        <section id="panel-properties" class="panel-body">
          <div class="panel-head"><strong>Свойства вывески</strong></div>
          <div id="properties" class="properties empty">Выберите текст или Artboard</div>
        </section>

        <div class="panel-footer">
          <button id="newProjectBtn">Новый</button>
          <button id="exportBtn">Экспорт JSON</button>
          <label class="import-label">Импорт JSON<input id="importInput" type="file" accept="application/json,.json" hidden /></label>
        </div>
      </aside>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
